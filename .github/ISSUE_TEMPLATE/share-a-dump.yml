name: Share a dump
description: Share an NDDUMP.BIN from your Contax N Digital for preservation (by link, not attachment).
title: "Dump: <firmware version before install>, <date>"
labels: ["dump"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for preserving your camera! Please share **v2 dumps only** (header `NDLRDMP2`): v1 dumps are mostly
        RAM, not flash. Please **do not attach the dump file here**. Host it wherever you like (cloud drive, archive)
        and paste a link below. A dump is a copy of your camera's flash, including whatever settings and per-camera
        data it stores; only share what you're comfortable with. Serial numbers are optional.
  - type: input
    id: fw_before
    attributes:
      label: Firmware version shown by the camera BEFORE installing NDDUMP
      placeholder: "e.g. 1.08 (camera menu → VERSION)"
    validations:
      required: true
  - type: textarea
    id: hashes
    attributes:
      label: SHA-256 of each NDDUMP.BIN
      description: "`shasum -a 256 NDDUMP*.BIN`"
      render: text
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Check output (README Step 5)
      description: "Output of `python3 tools/check_nddump.py NDDUMP*.BIN`"
      render: text
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Download link (optional)
      placeholder: "https://…"
  - type: textarea
    id: notes
    attributes:
      label: Anything notable
      description: What the screen showed, how long the dump took, settings you changed between dumps, camera condition, serial (optional)…
