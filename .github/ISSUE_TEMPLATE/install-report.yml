name: Install report
description: Report how installing NDDUMP went — success OR failure. Both matter.
title: "Install: <success/failure>, from firmware <version>"
labels: ["install-report"]
body:
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Success — camera works normally and dumps work
        - Went back to stock with the update menu (v2)
        - Partial — installed, but dumps don't work
        - Failure — camera no longer starts / bricked
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: NDDUMP version installed
      options:
        - v2 (sha256 43eefee0…)
        - v1 (sha256 c8deab4c…) — the old version that can't be removed from the menu
        - Not sure
    validations:
      required: true
  - type: input
    id: fw_before
    attributes:
      label: Firmware version before install
      placeholder: "e.g. 1.07 or 1.08"
    validations:
      required: true
  - type: input
    id: patched_hash
    attributes:
      label: SHA-256 of the CXBRFIRM.BIN you flashed
      placeholder: "v2 should be 43eefee09a3ec052a16dd40a192d85360121351c4834aaedb43002770a75347f"
    validations:
      required: true
  - type: dropdown
    id: power
    attributes:
      label: Power during install
      options:
        - Battery + AC adapter
        - Battery only
        - AC adapter only
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: Steps, on-screen messages (photos welcome), timings, CF card make/size.
    validations:
      required: true
